server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # React Router uses client-side routes (e.g. /history, /analysis/3).
        # Any path nginx can't find as a file should fall back to index.html
        # so React Router can render the right page.
        try_files $uri $uri/ /index.html;
    }
}
